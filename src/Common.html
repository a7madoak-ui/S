        '<span class="chart__list-name">' + esc(it.label) + '</span>' +
        '<span class="chart__list-val num">' + esc(App.fmt.num(it.value) + unit) + '</span>' +

        '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true" focusable="false">' +
        '<circle class="ring__track" cx="' + f2(size / 2) + '" cy="' + f2(size / 2) + '" r="' + f2(r) + '" fill="none" stroke-width="' + sw + '"' + (track ? ' style="stroke:' + track + '"' : '') + '/>' +

    }
