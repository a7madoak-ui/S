  /* --- bulk text (mirrors the server's parser for the live count) */
  var BULK_HEADERS = ['اسم المدرسة', 'المدرسة', 'المدارس', 'name', 'school'];
  /** Cells of a pasted line; a leading serial «م» / ministry-number cell is dropped (same rule as the server). */
  function bulkCells(line) {
    var parts = String(line).split(/[\t,،|]/).map(function (p) { return p.trim(); });
    if (parts.length > 1 && /^(?:[\d٠-٩]{1,15}|م|#)$/.test(parts[0])) parts.shift();
    return parts;
  }
  function parseBulk(text, existing) {
    var seen = {};
    (existing || []).forEach(function (n) { seen[normAr(n)] = true; });
    var items = [], skipped = [];
    String(text || '').replace(/\r\n?/g, '\n').split('\n').forEach(function (line, i) {
      if (!line.trim()) return;
      var name = bulkCells(line)[0].replace(/^[\d٠-٩]{1,3}\s*[-.)–]\s*/, '').replace(/^[•●▪\-*]\s*/, '').replace(/\s+/g, ' ').trim();
      if (BULK_HEADERS.indexOf(name.toLowerCase()) >= 0) { skipped.push({ line: i + 1, reason: 'سطر عناوين' }); return; }
      if (name.length < 2 || name.length > 120) { skipped.push({ line: i + 1, reason: 'اسم غير صالح' }); return; }
      var k = normAr(name);
      if (seen[k]) { skipped.push({ line: i + 1, reason: 'مكررة' }); return; }
      seen[k] = true;
      items.push({ line: i + 1, name: name });
    });
    return { items: items, skipped: skipped };

  function go(view, opts) {

  /* ------------------------------------------------------------- review flows */
  function pendingLeft() { return S.day ? S.day.rows.filter(function (r) { return r.report && r.report.status === 'pending'; }).length : 0; }
  function reviewCall(date, id, action, note, btn) {

  function returnFlow(date, id, btn) {

  var NOTICE = null;

      body: html`<article class="doc ad-qrdoc">
        <div class="doc__brand"><span class="brand">${brandMark()}<span class="brand__name">${APP_NAME}</span></span><span>${systemTitle()}</span></div>
        <h2 class="doc__title mt-3">${title}</h2>

        <p class="text-sm">امسح الرمز بكاميرا الجوال لفتح نموذج المتابعة اليومية.</p>
        <p class="ad-qrdoc__url">${url}</p>

      foot: html`<button type="button" class="btn btn-primary" data-action="doc-print">${icon('print')}<span>طباعة</span></button><button type="button" class="btn btn-secondary" data-action="copy-url" data-url="${url}">${icon('copy')}<span>نسخ الرابط</span></button><button type="button" class="btn btn-ghost" data-modal-close>إغلاق</button>`
    });
    A.loadScript(QR_URL).then(function () {
      var box = $('#qr-box', m.el);
      if (!box || typeof window.qrcode !== 'function') throw new Error('qr');
      var qr = window.qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      var svg = String(qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }));
      if (!/^\s*<svg[\s>]/i.test(svg) || /<script|on\w+\s*=/i.test(svg)) throw new Error('qr');
      box.innerHTML = svg;
      var el = box.querySelector('svg');
      if (el) { el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'رمز QR لرابط ' + title); }
    }).catch(function () {
      var box = $('#qr-box', m.el);
      if (box) setHtml(box, html`<div class="alert alert--warn">${icon('wifi-off')}<div>تعذّر إنشاء رمز QR — تحقّق من الاتصال بالإنترنت</div></div>`);
    });
  }

  /* --- per-school actions */
  var SchoolAct = {

      };

          ${b('school-relink', 'link', 'إنشاء رابط جديد', 'يتوقف الرابط الحالي فورًا')}

    wa: function (id) {

    copy: function (id) {

            foot: html`<button type="button" class="btn btn-whatsapp" data-action="school-wa" data-id="${ns.id}" data-sheet>${icon('whatsapp')}<span>إرسال عبر واتساب</span></button><button type="button" class="btn btn-secondary" data-action="school-copy" data-id="${ns.id}">${icon('copy')}<span>نسخ الرابط</span></button><button type="button" class="btn btn-ghost" data-modal-close>إغلاق</button>`
          });

    repin: function (id, btn) {

    setActive: function (id, active, btn) {

    },
    del: function (id, btn) {
      var s = schoolById(id);

  /* ============================================================== 11. view: stats */
  var STAT_PRESETS = [['week', 'هذا الأسبوع'], ['last7', 'آخر 7 أيام'], ['month', 'هذا الشهر'], ['last30', 'آخر 30 يومًا'], ['custom', 'مخصص']];
  var P_WORKDAY = ['يوم دوام واحد', 'يوما دوام', 'أيام دوام', 'يوم دوام', 'يومي دوام'];
  /** «X من Y» for a school: reports on expected days only (never more than Y); others are counted apart. */
  function daysText(s) {
    var on = isNum(s.onTimeDays) ? s.onTimeDays : s.submittedDays, extra = isNum(s.extraDays) ? s.extraDays : 0;
    if (!s.expectedDays) return s.submittedDays ? plural(s.submittedDays, P_REPORT) : '0 من 0';
    return on + ' من ' + s.expectedDays + (extra > 0 ? ' + ' + extra + ' خارج الأيام المتوقعة' : '');
  }
  function onTimeOf(x) { return isNum(x.onTime) ? x.onTime : x.submitted; }

  var Stats = {
    mount: function (el) {
      setHtml(el, html`<div class="ad-pagehead">
          <div class="ad-pagehead__text"><h1>الإحصاءات</h1><p id="st-label">مؤشرات المدارس خلال فترة تختارها.</p></div>
          <div class="ad-pagehead__actions" id="st-actions"></div>
        </div>
        <div class="ad-range">
          <div class="segmented" role="group" aria-label="الفترة" id="st-presets"></div>
          <div class="ad-range__custom" id="st-custom"></div>
        </div>
        <div id="st-body" class="mt-4"></div>`);
      Stats.paintControls();
      loadBoot().then(function () {
        if (S.view !== 'stats') return;
        Stats.paintControls();
        Stats.ensure();
      }, function (e) { if (S.view === 'stats') setHtml(byId('st-body'), errorState(e, 'stats-retry')); });
    },
    leave: function () { Stats.destroyCharts(); },
    range: function () {
      var t = todayISO(), p = S.stats.preset;
      if (p === 'week') return [A.date.startOfWeek(t), t];
      if (p === 'last7') return [A.date.add(t, -6), t];
      if (p === 'month') return [A.date.startOfMonth(t), t];
      if (p === 'custom' && A.date.isISO(S.stats.from) && A.date.isISO(S.stats.to)) return [S.stats.from, S.stats.to];
      return [A.date.add(t, -29), t];
    },
    paintControls: function () {
      var pe = byId('st-presets'), ce = byId('st-custom'), ae = byId('st-actions');
      if (!pe) return;
      setHtml(pe, STAT_PRESETS.map(function (p) {
        var on = S.stats.preset === p[0];
        return html`<button type="button" class="${on ? 'is-active' : ''}" data-action="stats-preset" data-p="${p[0]}" aria-pressed="${on}">${p[1]}</button>`;
      }));
      var r = Stats.range(), t = todayISO();
      setHtml(ce, S.stats.preset === 'custom' ? html`
        <div class="field"><label class="field__label" for="st-from">من</label><input type="date" id="st-from" class="input" value="${r[0]}" max="${t}"></div>
        <div class="field"><label class="field__label" for="st-to">إلى</label><input type="date" id="st-to" class="input" value="${r[1]}" max="${t}"></div>
        <button type="button" class="btn btn-primary" data-action="stats-apply">${icon('chart')}<span>عرض</span></button>` : '');
      ce.hidden = S.stats.preset !== 'custom';
      var sheet = S.boot && S.boot.spreadsheetUrl;
      setHtml(ae, html`<button type="button" class="btn btn-secondary" data-action="stats-print" aria-label="طباعة التقرير"${attr(!S.stats.data, 'disabled')}>${icon('print')}<span>طباعة<span class="hide-mobile"> التقرير</span></span></button>
        <button type="button" class="btn btn-secondary" data-action="stats-csv" aria-label="تنزيل Excel"${attr(!S.stats.data, 'disabled')}>${icon('download')}<span><span class="hide-mobile">تنزيل </span>Excel</span></button>
        ${sheet ? html`<a class="btn btn-secondary" href="${sheet}" target="_blank" rel="noopener" aria-label="فتح ملف Google Sheets">${icon('sheet')}<span><span class="hide-mobile">فتح ملف Google </span>Sheets</span></a>` : ''}`);
    },
    ensure: function () {
      var r = Stats.range(), key = r[0] + '|' + r[1];
      if (S.stats.data && S.stats.key === key && Date.now() - S.stats.at < 5 * 60000) { Stats.paint(); return; }
      Stats.load(r[0], r[1]);
    },
    load: function (from, to) {
      var seq = ++S.stats.seq;
      S.stats.loading = true;
      Stats.destroyCharts();
      Stats.skeleton();
      return auth('api_range', from, to).then(function (d) {
        if (seq !== S.stats.seq) return;
        S.stats.data = d; S.stats.key = from + '|' + to; S.stats.at = Date.now(); S.stats.loading = false;
        if (S.view === 'stats') { Stats.paintControls(); Stats.paint(); }
      }, function (e) {
        if (seq !== S.stats.seq) return;
        S.stats.loading = false;
        if (S.view === 'stats') setHtml(byId('st-body'), errorState(e, 'stats-retry'));
      });
    },
    destroyCharts: function () { (S.stats.charts || []).forEach(function (c) { try { if (c) c.destroy(); } catch (e) { /* ignore */ } }); S.stats.charts = []; },
    skeleton: function () {
      var k = [0, 1, 2, 3, 4].map(function () { return html`<div class="kpi ad-kpi-sk" aria-hidden="true">${skel()}${skel('skeleton--title')}${skel('skeleton--text', 'width:70%')}</div>`; });
      var c = html`<div class="card" aria-hidden="true"><div class="card__body">${skel('skeleton--title')}<div class="mt-3">${skel('ad-chart-sk')}</div></div></div>`;
      setHtml(byId('st-body'), html`<div class="ad-kpis ad-kpis--5" role="status" aria-label="جارٍ حساب الإحصاءات">${k}</div><div class="ad-charts">${c}${c}</div>`);
    },
    paint: function () {
      var d = S.stats.data, body = byId('st-body'), lab = byId('st-label');
      if (!d || !body) return;
      Stats.destroyCharts();
      var t = d.totals || {}, th = thr(), c = Today.cols();
      if (lab) lab.textContent = 'من ' + dateShort(d.from) + ' إلى ' + dateShort(d.to) + ' ' + d.to.slice(0, 4) + ' • ' + (d.workdays ? plural(d.workdays, P_WORKDAY) : 'لا توجد أيام دوام');
      var k = [];
      var cp = isNum(t.compliancePct) ? t.compliancePct : null;
      k.push(html`<div class="kpi${cp === null ? '' : cp >= 95 ? ' kpi--ok' : cp < 80 ? ' kpi--warn' : ''}"><div class="kpi__label">${icon('send')}<span>الالتزام بالتسليم</span></div><div class="kpi__value">${pct(cp)}</div><div class="kpi__meta">من التقارير المتوقَّعة في أيام الدوام</div></div>`);
      if (c.students) { var sv = isNum(t.avgStudentAbsencePct) ? t.avgStudentAbsencePct : null; k.push(html`<div class="kpi${sv === null ? '' : sv >= th.studentAbsencePct ? ' kpi--danger' : ' kpi--ok'}"><div class="kpi__label">${icon('users')}<span>متوسط غياب الطلاب</span></div><div class="kpi__value">${pct(sv)}</div><div class="kpi__meta">الحد ${pct(th.studentAbsencePct)}</div></div>`); }
      if (c.teachers) { var tv = isNum(t.avgTeacherAbsencePct) ? t.avgTeacherAbsencePct : null; k.push(html`<div class="kpi${tv === null ? '' : tv >= th.teacherAbsencePct ? ' kpi--warn' : ' kpi--ok'}"><div class="kpi__label">${icon('user')}<span>متوسط غياب المعلمين</span></div><div class="kpi__value">${pct(tv)}</div><div class="kpi__meta">الحد ${pct(th.teacherAbsencePct)}</div></div>`); }

    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var t = ev.target;
    if (!t || !t.matches || !t.matches('[data-action][tabindex]') || /^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    ev.preventDefault();
    t.click();
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var k = el.getAttribute('data-input');
    if (k && INPUT[k]) INPUT[k](el, ev);
    if (el.closest) {
      if (el.closest('.field.has-error') && el.id !== 'otp-in') setFieldError(el, '');
      var card = el.closest('.ad-set');
      if (card) Settings.check(card);
    }
  });
  var CARETS = typeof WeakMap === 'function' ? new WeakMap() : { get: function () { return null; }, set: function () {} };
  ['keyup', 'click', 'select', 'input'].forEach(function (type) {
    document.addEventListener(type, function (ev) {
      var t = ev.target;
      if (t && t.tagName === 'TEXTAREA' && t.getAttribute('data-input') === 'tpl-preview' && typeof t.selectionStart === 'number') CARETS.set(t, [t.selectionStart, t.selectionEnd]);
    }, true);
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target, card = el && el.closest && el.closest('.ad-set');
    if (card) Settings.check(card);
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target, k = f && f.getAttribute && f.getAttribute('data-submit');
    if (!k) return;
    ev.preventDefault();
    var scope = f.closest('.modal') || document, b = $('[data-action="' + cssEsc(k) + '"]', scope);
    if (b) b.click();
  });

  /* ============================================================== 15. boot */
  function start() {
    var tok = A.store.get('session', null);
    if (tok && typeof tok === 'object' && typeof tok.token === 'string') tok = tok.token;
    S.token = typeof tok === 'string' && tok.length >= 16 && tok.length <= 256 ? tok : null;
    if (!S.token && tok) A.store.del('session');
    if (!BOOT.status.setupDone) Wizard.start();
    else if (!S.token) Login.show();
    else Shell.start();
  }
  start();
})();
</script>
