    }
    function drainRemote() {
      while (remoteActive < 2 && remoteQueue.length) {
        var job = remoteQueue.shift();
        remoteActive++;
        job().then(fin, fin);
      }
      function fin() { remoteActive--; drainRemote(); }
    }
    function hydratePhotos(scope) {
      if (!scope) return;
      $$('img[data-photo-id]', scope).forEach(function (img) {
        var id = img.getAttribute('data-photo-id');
        if (!id || img.getAttribute('src')) return;
        var holder = img.closest('.thumb, .sc-gal');
        loadRemotePhoto(id).then(function (url) {
          img.src = url;
          if (holder) holder.classList.remove('sc-loading');
          Object.keys(S.photos).forEach(function (fid) {
            (S.photos[fid] || []).forEach(function (it) { if (it.photo && it.photo.id === id) it.url = url; });
          });
        }, function () {
          if (!holder) return;
          holder.classList.remove('sc-loading');
          if (holder.classList.contains('sc-gal')) {
            holder.classList.add('sc-broken');
            App.render(holder, html`${icon('image')}`);
            holder.setAttribute('aria-label', 'تعذّر عرض الصورة');
          } else {
            img.remove();
            holder.setAttribute('title', 'تعذّر عرض الصورة');
            if (!holder.querySelector('.sc-thumb-err')) holder.insertAdjacentHTML('beforeend', '<span class="sc-thumb-err" style="color:var(--muted)">تعذّر عرض الصورة</span>');
          }
        });
      });
    }
    function openLightbox(url, label) {
      var box = doc.createElement('div');
      box.className = 'lightbox';
      var img = doc.createElement('img');
      img.alt = label || 'صورة الشاهد';
      box.appendChild(img);
      App.modal({ title: label || 'صورة الشاهد', body: box, size: 'lg' });
      if (url) img.src = url;
    }
    function viewPhotoById(id, label) {
      if (photoUrlCache[id]) { openLightbox(photoUrlCache[id], label); return; }
      loadRemotePhoto(id).then(function (u) { openLightbox(u, label); }, function () { App.toast('تعذّر عرض الصورة. حاول مرة أخرى.', 'danger'); });
    }

    /* ============================================================== SUBMIT */
    function photoErrorsCount() {
      var n = 0;
      Object.keys(S.photos).forEach(function (fid) { (S.photos[fid] || []).forEach(function (it) { if (it.status === 'error') n++; }); });
      return n;
    }
    /* ---- day rollover: a tab left open overnight must not file yesterday's form as today's ---- */
    var NOT_EDITABLE_MSG = 'لا يمكن فتح تقرير هذا اليوم.';
    /** The server's day changed since this form was loaded (S.clock follows the server's minute of day). */
    function dayRolled() {
      return !!(S.form && S.form.ok && !isPreview() && S.form.state !== 'correction' && S.form.state !== 'backfill' && nowMin() >= 1440);
    }
    var rolling = false;
    function onNewDay() {
      if (rolling || !S.token) return;
      rolling = true;
      saveDraftSoon.flush();
      var oldDate = S.form && S.form.date;
      var hadDraft = S.view === 'form' && !!S.form && !S.form.existing && hasMeaningfulAnswers();
      S.editing = false;
      S.correcting = false;
      App.toast('بدأ يوم جديد — تم تحميل نموذج اليوم.', 'info', 6000);
      var done = function () { rolling = false; };
      reloadToday(false).then(function () {
        done();
        if (hadDraft && S.form && Array.isArray(S.form.missingDays) && S.form.missingDays.indexOf(oldDate) >= 0) {
          S.backfillOpen = true;
          render();
          App.toast('ما كتبته ليوم ' + dayLabel(oldDate) + ' محفوظ — أرسله من «لم ترسل تقرير يوم سابق؟».', 'info', 8000);
        }
      }, done);
    }

    function submit() {
      if (S.submitting || !S.form) return;
      if (isPreview()) { App.toast('وضع المعاينة — لا يتم إرسال أي بيانات.', 'info'); return; }
      if (dayRolled()) { onNewDay(); return; }
      if (closedNow()) {
        saveDraftSoon.flush();
        S.form.state = 'closed';
        S.form.canEdit = false;
        setView('closed');
        window.scrollTo(0, 0);
        App.toast('انتهى وقت الإرسال لهذا اليوم — ما كتبته محفوظ على هذا الجهاز.', 'danger', 6000);
        return;
      }
      if (uploadsPending()) { App.toast('انتظر حتى يكتمل رفع الصور.', 'info'); return; }
      S.showErrors = true;
      var errs = validateAll();
      var keys = Object.keys(errs);
      applyErrors(errs, true);
      if (keys.length) {
        App.toast(keys.length === 1 ? 'أكمل الحقل المطلوب قبل الإرسال.' : 'أكمل الحقول المطلوبة (' + keys.length + ') قبل الإرسال.', 'danger');
        return;
      }
      var errPhotos = photoErrorsCount();
      var go = errPhotos
        ? App.confirm({ title: 'صور لم تُرفع', text: 'لم يكتمل رفع ' + photosWordG(errPhotos) + '. هل تريد إرسال التقرير بدونها؟', okText: 'إرسال بدونها', cancelText: 'رجوع' })
        : Promise.resolve(true);
      go.then(function (ok) { if (ok) doSubmit(); });
    }
    function doSubmit() {
      // Always name the day: a stale page can then never file its answers under another day.
      var payload = { answers: buildAnswers(), filledBy: S.filledBy.trim(), date: S.form.date };
      saveDraftNow();
      S.submitting = true;
      S.serverError = '';
      var errBox = doc.getElementById('sc-server-error');
      if (errBox) errBox.remove();
      updateBar();
      var token = S.token;
      App.call('api_submitReport', token, payload).then(function (res) {
        S.submitting = false;
        if (!res || !res.ok || !res.receipt) throw new Error('لم يكتمل الإرسال. حاول مرة أخرى.');
        var rec = res.receipt;
        clearDraft();
        App.store.set('filledBy:' + token, payload.filledBy);
        var lp = lessonsPair();
        if (lp && isNum(payload.answers[lp.p.id])) App.store.set('last:' + token, { planned: payload.answers[lp.p.id] });
        var wasCorrection = S.correcting;
        S.form.existing = rec;
        S.form.date = rec.date || S.form.date;
        if (Array.isArray(S.form.returned)) S.form.returned = S.form.returned.filter(function (r) { return r.date !== rec.date; });
        if (Array.isArray(S.form.missingDays)) S.form.missingDays = S.form.missingDays.filter(function (d) { return d !== rec.date; });
        if (S.form.state === 'correction' || S.form.state === 'backfill') S.form.canEdit = false;
        else if (rec.status === 'approved' && S.form.reviewEnabled) S.form.canEdit = false;
        S.editing = false;
        S.correcting = false;
        S.dirty = false;
        S.showErrors = false;
        S.justSent = true;

      }).catch(function (err) {
        S.submitting = false;

          updateBar();

        var network = err && (err.code === 'NETWORK' || err.code === 'TIMEOUT' || err.code === 'BUSY' || err.code === 'UNKNOWN' || err.code === 'NO_RUNTIME');

    function showServerError() {

      var tmp = doc.createElement('div');

    /** Server validation messages quote the field label in «…» — point at that field. */
    function highlightServerField(msg) {

      if (m) fl = fields().filter(function (x) { return x.label === m[1]; })[0] || null;
      if (!fl && /الحصص المفعّلة/.test(msg)) fl = kpiField('lessons_done');
      if (!fl && /اسم من يعبّئ/.test(msg)) { setFieldError(FILLED, { msg: msg }); return; }
      if (fl) setFieldError(fl.id, { msg: msg.replace(/^«[^»]+»:\s*/, '') });

    /* ======================================================== LOAD ACTIONS */
    function fetchForm(token, date) {
      return App.call('api_schoolForm', token, date || null).then(function (res) {

        return res;
      });
    }
    function startCorrection(date, btn) {
      var f = S.form;
      if (f.existing && f.date === date && f.existing.status === 'returned') {
        S.editing = true;
        S.correcting = true;
        S.correctionNote = str(f.existing.reviewNote);
        S.showErrors = false;
        S.errors = {};
        S.draftRestored = false;
        initFormState();
        S.view = 'form';
        render();
        window.scrollTo(0, 0);
        return;
      }
      App.busy(btn, fetchForm(S.token, date)).then(function (res) {
        if (!res.ok) {
          App.toast(res.error || 'لا يمكن فتح تقرير هذا اليوم.', 'danger');
          if (res.code === 'NOT_EDITABLE') reloadToday(true);
          return;
        }
        loadForm(res);
      }, function (err) { App.toast(err.message, 'danger'); });
    }
    /** Opens the form of a missed workday (late report). */
    function startBackfill(date, btn) {
      if (!App.date.isISO(date)) return;
      App.busy(btn, fetchForm(S.token, date)).then(function (res) {
        if (!res.ok) {
          App.toast(res.error || 'لا يمكن فتح تقرير هذا اليوم.', 'danger');

          return;
        }
        S.backfillOpen = false;
        loadForm(res);
      }, function (err) { App.toast(err.message, 'danger'); });

    function reloadToday(quiet, btn) {
      var p = fetchForm(S.token, null);
      if (btn) App.busy(btn, p);
      else if (!quiet) setView('loading');
      return p.then(function (res) {
        if (!res.ok) { showFormError(res); return; }
        loadForm(res);
      }, function (err) {
        if (quiet) { App.toast(err.message, 'danger'); return; }
        S.viewError = { code: 'ERROR', error: err.message, network: err.code === 'NETWORK' };
        setView('error');
      });

    function showFormError(res) {
      if (S.mode === 'picker' && (res.code === 'BAD_LINK' || res.code === 'INACTIVE')) {
        App.store.del('school');

        S.form = null;
        S.pickChange = true;
        S.pickNotice = res.code === 'INACTIVE' ? res.error : 'لم يعد رابط مدرستك المحفوظ صالحًا. اختر مدرستك وأدخل رمزها من جديد.';
        setView('picker');
        return;
      }
      S.viewError = res;
      setView('error');

    /* picker */
    function pickerEnter(btn) {

        return;
      }

      var p = App.call('api_resolveSchool', S.pickId, pin).then(function (res) {
        if (!res || !res.ok || !res.token) throw new Error('تعذّر الدخول. حاول مرة أخرى.');
        App.store.set('school', { token: res.token, schoolName: school ? school.name : '' });
        S.token = res.token;
        return fetchForm(res.token, null);
      });
      App.busy(btn, p).then(function (res) {
        if (!res.ok) { showFormError(res); return; }

        S.pickNotice = '';

    /* =============================================================== EVENTS */
    function closestAction(t) { return t && t.closest ? t.closest('[data-action]') : null; }

        case 'photo-retry': return retryPhoto(fid, el.getAttribute('data-key'));

            if (!ok) return;

            initFormState();
            S.draftRestored = false;

        case 'use-last': {

          var lv = toCount(el.getAttribute('data-value'));

          S.answers[lf] = lv;

        }
        case 'use-principal': {
          var inp = doc.getElementById('in-filledBy');
          S.filledBy = str(S.form.school && S.form.school.principal).trim();
          if (inp) inp.value = S.filledBy;

          if (sg) sg.textContent = '';
          markDirty();
          revalidate(FILLED);
          refreshStatus();
          return;
        }
        case 'pick': {
          S.pickId = el.getAttribute('data-id') || '';
          var pinVal = (doc.getElementById('sc-pin') || {}).value || '';
          render();

        }
        case 'pick-clear': {

        case 'pick-back':

          S.pickId = '';
          S.pickNotice = '';
          render();
          return;
        case 'pick-forget':   // a shared device: the saved school (and its code) is removed from it
          App.store.del('school');
          S.token = '';
          S.pickChange = false;
          S.pickId = '';
          S.pickNotice = '';
          render();
          App.toast('تم الخروج من هذا الجهاز. للدخول مرة أخرى اختر مدرستك وأدخل رمزها.', 'ok');
          return;
        case 'enter': return pickerEnter(el);
        case 'continue': return continueStored(el);
        case 'change-school':

          window.scrollTo(0, 0);

      }
    });

    function onChoose(el) {
      var fid = el.getAttribute('data-fid');
      var fl = fieldById(fid);
      if (!fl) return;
      var opt = optionsOf(fl)[+el.getAttribute('data-index')];
      if (!opt) return;
      var cur = S.answers[fid];
      var next = opt.value;
      if (cur === next && !fl.required) next = null;
      S.answers[fid] = next;
      $$('.choice[data-fid="' + fid + '"]', root).forEach(function (b) {
        var o = optionsOf(fl)[+b.getAttribute('data-index')];
        b.setAttribute('aria-checked', o && o.value === next ? 'true' : 'false');
      });
      markDirty();
      revalidate(fid);
      refreshStatus();
    }

    root.addEventListener('input', function (ev) {
      var t = ev.target;
      var kind = t && t.getAttribute ? t.getAttribute('data-kind') : null;
      if (!kind) return;
      if (kind === 'num' || kind === 'att') {
        var clean = digitsOnly(t.value).replace(/^0+(?=\d)/, '').slice(0, 6);
        if (clean !== t.value) t.value = clean;
        var val = clean === '' ? null : parseInt(clean, 10);
        if (kind === 'num') {
          var fid = t.getAttribute('data-fid');
          S.answers[fid] = val;
          var pair = lessonsPair();
          if (pair && (fid === pair.p.id || fid === pair.d.id)) updateLessons();
          if (pair && fid === pair.p.id && val !== null) { var sl = doc.getElementById('sc-last'); if (sl) sl.remove(); }
          revalidate(fid);
        } else {
          onAttInput(t.getAttribute('data-row'), t.getAttribute('data-part'), val);
        }
        markDirty();
        refreshStatus();
        return;
      }
      if (kind === 'text') {
        var id = t.getAttribute('data-fid');
        S.answers[id] = t.value;
        updateCounter(id);
        if (t.tagName === 'TEXTAREA') autoGrow(t);
        markDirty();
        revalidate(id);
        refreshStatus();
        return;
      }
      if (kind === 'filledBy') {
        S.filledBy = t.value;
        markDirty();
        revalidate(FILLED);
        refreshStatus();
        return;
      }
      if (kind === 'search') {
        S.pickQuery = t.value;
        var list = doc.getElementById('sc-picklist');
        if (list && S.picker) App.render(list, html`${pickListItems(S.picker.schools || [])}`);
        return;
      }
      if (kind === 'pin') {
        var d = digitsOnly(t.value).slice(0, 4);
        if (d !== t.value) t.value = d;
        if (d.length) setPinError('');
      }
    });

    root.addEventListener('change', function (ev) {
      var t = ev.target;
      var kind = t && t.getAttribute ? t.getAttribute('data-kind') : null;
      if (kind === 'file') {
        var files = t.files;
        var fid = t.getAttribute('data-fid');
        var copy = Array.prototype.slice.call(files || []);
        try { t.value = ''; } catch (e) { /* ignore */ }
        addFiles(fid, copy);
      } else if (kind === 'select') {
        var fl = fieldById(t.getAttribute('data-fid'));
        if (!fl) return;
        var o = optionsOf(fl)[+t.value];
        S.answers[fl.id] = t.value === '' || !o ? null : o.value;
        markDirty();
        revalidate(fl.id);
        refreshStatus();
      }
    });

    root.addEventListener('keydown', function (ev) {
      var t = ev.target;
      if (!t || !t.getAttribute) return;
      var kind = t.getAttribute('data-kind');
      if (ev.key === 'Enter' && !ev.isComposing) {
        if (kind === 'pin') { ev.preventDefault(); pickerEnter(doc.getElementById('sc-enter')); return; }
        if (kind === 'search') { ev.preventDefault(); var first = $('.sc-pick', root); if (first) first.click(); return; }
        if (t.hasAttribute('data-nav') && t.tagName === 'INPUT') {
          ev.preventDefault();
          focusNext(t);
          return;
        }
      }
      if (kind === 'num' && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
        ev.preventDefault();
        stepField(t.getAttribute('data-fid'), ev.key === 'ArrowUp' ? 1 : -1);
        return;
      }
      if (t.classList.contains('choice') && t.getAttribute('role') === 'radio') {
        var keys = { ArrowLeft: 1, ArrowDown: 1, ArrowRight: -1, ArrowUp: -1 };
        if (keys[ev.key] !== undefined) {
          ev.preventDefault();
          var group = $$('.choice[data-fid="' + t.getAttribute('data-fid') + '"]', root);
          var i = group.indexOf(t);
          var n = group[(i + keys[ev.key] + group.length) % group.length];
          if (n) { n.focus(); onChoose(n); }
        }
      }
    });
    function focusNext(cur) {
      var list = $$('[data-nav]', root).filter(function (el) { return !el.disabled && el.offsetParent !== null; });
      var i = list.indexOf(cur);
      for (var j = i + 1; j < list.length; j++) {
        var el = list[j];
        if (el.classList.contains('is-auto')) continue;
        focusNoScroll(el);
        scrollToEl(el, 'center');
        return;
      }
      cur.blur();
    }

    /* select-on-focus for numeric inputs; out-of-range numbers are flagged on blur */
    root.addEventListener('focusin', function (ev) {
      var t = ev.target;
      var kind = t && t.getAttribute ? t.getAttribute('data-kind') : null;
      if (kind === 'num' || kind === 'att' || kind === 'pin') {
        setTimeout(function () { try { t.setSelectionRange(0, t.value.length); } catch (e) { /* ignore */ } }, 0);
      }
      syncKeyboard();
    });
    root.addEventListener('focusout', function (ev) {
      var t = ev.target;
      if (t && t.getAttribute && t.getAttribute('data-kind') === 'num' && t.value !== '') {
        var fl = fieldById(t.getAttribute('data-fid'));
        var e = fl ? validateField(fl) : null;
        if (e) { S.errors[fl.id] = e; setFieldError(fl.id, e); }
      }
      setTimeout(syncKeyboard, 120);
    });
    /* The sticky bar steps aside only while the on-screen keyboard is really open
       (visual viewport much shorter than the layout viewport), never on desktop. */
    function syncKeyboard() {
      var vv = window.visualViewport;
      var a = doc.activeElement;
      var typing = !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'file';
      var kb = !!vv && COARSE && (window.innerHeight - vv.height * (vv.scale || 1)) > 140;
      doc.body.classList.toggle('sc-typing', typing && kb);
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncKeyboard);

    /* steppers: tap = one step, hold = repeat */
    var hold = { timer: null, rep: null, btn: null, fid: '', dir: 0, pending: false };
    function stepField(fid, dir) {
      var fl = fieldById(fid);
      if (!fl) return;
      var b = numBounds(fl);
      var cur = S.answers[fid];
      var next = isNum(cur) ? cur + dir : (dir > 0 ? Math.max(b.min, 1) : b.min);
      next = Math.max(b.min, Math.min(b.max, next));
      S.answers[fid] = next;
      var inp = doc.getElementById('in-' + fid);
      if (inp) inp.value = String(next);
      var pair = lessonsPair();
      if (pair && (fid === pair.p.id || fid === pair.d.id)) updateLessons();
      if (pair && fid === pair.p.id) { var sl = doc.getElementById('sc-last'); if (sl) sl.remove(); }
      markDirty();
      revalidate(fid);
      refreshStatus();
    }
    function stopHold() {
      clearTimeout(hold.timer);
      clearInterval(hold.rep);
      hold.timer = hold.rep = null;
    }
    /* Mouse: step on press. Touch/pen: step on release, so a scroll that starts on a
       button never changes a number (the browser cancels the pointer when it scrolls). */
    root.addEventListener('pointerdown', function (ev) {
      var el = ev.target.closest && ev.target.closest('[data-action="step"]');
      if (!el || el.disabled || (ev.button !== undefined && ev.button !== 0)) return;
      if (ev.pointerType === 'mouse') ev.preventDefault();
      stopHold();
      hold.btn = el;
      hold.fid = el.getAttribute('data-fid');
      hold.dir = +el.getAttribute('data-step');
      hold.pending = ev.pointerType !== 'mouse';
      if (!hold.pending) stepField(hold.fid, hold.dir);
      hold.timer = setTimeout(function () {
        hold.pending = false;
        stepField(hold.fid, hold.dir);
        hold.rep = setInterval(function () { stepField(hold.fid, hold.dir); }, 85);
      }, 420);
    });
    root.addEventListener('pointerup', function () {
      if (!hold.btn) return;
      if (hold.pending) stepField(hold.fid, hold.dir);
      stopHold();
      hold.btn = null;
    }, true);
    ['pointercancel', 'pointerleave'].forEach(function (n) {
      root.addEventListener(n, function (ev) {
        if (!hold.btn || (n === 'pointerleave' && ev.target !== hold.btn)) return;
        stopHold();
        hold.btn = null;
      }, true);
    });
    root.addEventListener('contextmenu', function (ev) { if (ev.target.closest && ev.target.closest('.stepper__btn')) ev.preventDefault(); });
    /* keyboard activation of a stepper button (Enter/Space) arrives as a click with detail 0 */
    root.addEventListener('click', function (ev) {
      var el = ev.target.closest && ev.target.closest('[data-action="step"]');
      if (el && ev.detail === 0 && !el.disabled) stepField(el.getAttribute('data-fid'), +el.getAttribute('data-step'));
    });

    /* drag & drop onto the drop zone (desktop) */
    root.addEventListener('dragover', function (ev) {
      var z = ev.target.closest && ev.target.closest('.uploader__drop, .sc-add-tile');
      if (!z || isPreview()) return;
      ev.preventDefault();
      z.classList.add('is-dragover');
    });
    root.addEventListener('dragleave', function (ev) {
      var z = ev.target.closest && ev.target.closest('.uploader__drop, .sc-add-tile');
      if (z) z.classList.remove('is-dragover');
    });
    root.addEventListener('drop', function (ev) {
      var z = ev.target.closest && ev.target.closest('.uploader__drop, .sc-add-tile');
      if (!z || isPreview()) return;
      ev.preventDefault();
      z.classList.remove('is-dragover');
      var inp = z.querySelector('input[type="file"]');
      if (inp && ev.dataTransfer && ev.dataTransfer.files) addFiles(inp.getAttribute('data-fid'), ev.dataTransfer.files);
    });

    /* keep the draft on tab switches / page hide; warn while photos upload */
    doc.addEventListener('visibilitychange', function () {
      if (doc.visibilityState === 'hidden') saveDraftSoon.flush();
      else if (doc.visibilityState === 'visible' && dayRolled()) onNewDay();
    });
    window.addEventListener('pagehide', function () { saveDraftSoon.flush(); });
    window.addEventListener('pageshow', function () { if (dayRolled()) onNewDay(); });
    window.addEventListener('beforeunload', function (ev) {
      if (uploadsPending() || S.submitting) { ev.preventDefault(); ev.returnValue = ''; return ''; }
      return undefined;
    });
    window.addEventListener('offline', function () { App.toast('انقطع الاتصال بالإنترنت — ما تكتبه محفوظ على جهازك.', 'info', 5000); });
    window.addEventListener('online', function () { App.toast('عاد الاتصال بالإنترنت.', 'ok'); });

    /* deadline chip stays current while the page is open; a new day reloads today's form
       (except while typing — the submit-time check covers that, so typing is never interrupted) */
    setInterval(function () {
      if (!S.form || !S.form.ok) return;
      if (dayRolled()) { if (S.view !== 'form') onNewDay(); return; }
      if (S.view !== 'form' && S.view !== 'offday') return;
      var chip = doc.getElementById('sc-chip');
      if (chip && doc.getElementById('sc-dl')) App.render(chip, deadlineChipHtml());
    }, 30000);

    /* ================================================================ BOOT */
    function start() {
      if (BOOT.page !== 'school') {
        S.viewError = { code: 'ERROR', error: 'تعذّر تحميل الصفحة. حدّث الصفحة وحاول مرة أخرى.' };
        setView('error');
        return;
      }
      if (S.mode === 'picker') {
        if (!S.picker || !S.picker.ok) {
          S.viewError = S.picker || { code: 'ERROR' };
          setView('error');
          return;
        }
        setView('picker');
        return;
      }
      S.token = str(BOOT.token);
      var form = BOOT.form;
      if (!form || !form.ok) {
        S.viewError = form || { code: 'ERROR' };
        setView('error');
        return;
      }
      if (!form.preview) pruneOldDrafts();
      loadForm(form, { noScroll: true });
    }
    try {
      start();
    } catch (err) {
      try { console.warn('[nabd] start failed', err); } catch (e) { /* ignore */ }
      root.innerHTML = '';
      S.viewError = { code: 'ERROR', error: 'تعذّر عرض الصفحة. حدّث الصفحة وحاول مرة أخرى.' };
      try { setView('error'); } catch (e2) { root.textContent = 'تعذّر عرض الصفحة. حدّث الصفحة وحاول مرة أخرى.'; }
    }
  })();
  </script>
</body>
</html>
